[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "domain-mapper"
version = "0.1.0.dev0"
description = "Passive attack-surface mapping of a domain you are authorized to assess, rendered as a graph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nakken13" }]
keywords = ["osint", "attack-surface", "passive-recon", "graph", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "dnspython>=2.6",
    "httpx>=0.27",
    "idna>=3.7",
    "jinja2>=3.1",
    "networkx>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
domain-mapper = "domain_mapper.cli:app"
domain-mapper-tool = "domain_mapper.tui:main"

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=domain_mapper --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["domain_mapper"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
